<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F3F7EF; --card:#fff; --ink:#173404; --muted:#5F7A4A; --line:#DCE9CF; --soft:#EAF3DE;
    --brand:#27500A; --brand-2:#3B6D11; --brand-3:#639922; --brand-4:#97C459;
    --ok:#3B6D11; --warn:#B7700A; --bad:#C0392B;
    --sick:#E24B4A; --personal:#E67E22; --holiday:#D4537E; --vacation:#16A085; --swap:#2E86C1; --other:#5D6D7E;
    --r:14px; --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  [hidden]{display:none!important}
  button{font:inherit}
  .ti{line-height:1;vertical-align:-2px}
  .btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,background .15s}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-p{background:var(--brand-2);color:#fff} .btn-p:hover{background:var(--brand)}
  .btn-ok{background:var(--brand-2);color:#fff}
  .btn-bad{background:#FCEBEB;color:var(--bad)}
  .btn-ghost{background:transparent;color:var(--muted)}
  .btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--brand-3);box-shadow:0 0 0 3px rgba(99,153,34,.15)}
  textarea{resize:vertical;min-height:64px}
  label.l{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:600}

  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,var(--brand) 0,var(--brand) 38%,var(--bg) 38%)}
  .login .box{background:#fff;border-radius:22px;padding:28px 22px 22px;width:100%;max-width:350px;box-shadow:0 12px 40px rgba(23,52,4,.18);text-align:center}
  .logo{width:76px;height:76px;border-radius:24px;background:var(--soft);color:var(--brand-2);display:flex;align-items:center;justify-content:center;margin:-66px auto 12px;border:4px solid #fff;box-shadow:0 6px 20px rgba(23,52,4,.15);overflow:hidden}
  .logo .ti{font-size:40px}
  .logo img{width:100%;height:100%;object-fit:cover}
  .login h1{margin:0 0 4px;color:var(--brand);font-size:22px}
  .login p{margin:0 0 8px;color:var(--muted);font-size:14px}
  .login label.l{text-align:left}
  .login input{font-size:18px;text-align:center;letter-spacing:2px}
  .err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}

  header{background:var(--brand);color:#fff;padding:14px 16px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-4);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
  header .who{flex:1;line-height:1.25;min-width:0}
  header .who small{display:block;color:#C0DD97;font-size:12px}
  header .who b{font-size:16px;font-weight:600}
  .icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:12px;width:40px;height:40px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
  .icon-btn .ti{font-size:21px}
  .badge{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px;border:2px solid var(--brand)}

  nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);background:#fff;border-top:1px solid var(--line);display:flex;z-index:8;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:0;background:none;color:#8AA676;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative}
  nav button .ti{font-size:23px}
  nav button.on{color:var(--brand)}
  nav button.on .ico{background:var(--soft)}
  nav .ico{border-radius:99px;padding:3px 16px;display:inline-flex;transition:background .15s}
  nav .nb{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:16px}
  main{max-width:1100px;margin:0 auto;padding:16px 14px calc(var(--nav-h) + 90px)}
  @media(min-width:900px){
    nav{position:sticky;top:70px;bottom:auto;height:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:4px;padding:6px}
    nav button{flex:none;flex-direction:row;font-size:14px;gap:6px;padding:8px 14px;border-radius:10px}
    nav button .ti{font-size:19px}
    nav .ico{padding:0;background:none!important}
    nav button.on{background:var(--soft)}
    nav .nb{position:static;margin-left:2px}
    main{padding-bottom:110px}
  }
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sp{flex:1}
  h2.t{font-size:18px;margin:2px 0 12px;display:flex;align-items:center;gap:8px;color:var(--brand)}
  h2.t .ti{font-size:22px}
  .empty{text-align:center;padding:30px 10px;color:var(--muted)}
  .empty .ti{font-size:44px;color:var(--brand-4);display:block;margin-bottom:6px}

  .quota{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  @media(min-width:700px){.quota{grid-template-columns:repeat(4,1fr)}}
  .q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .q .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;font-weight:600}
  .q .v{font-size:24px;font-weight:700;margin-top:6px}
  .q .v small{font-size:12px;font-weight:400;color:var(--muted)}
  .q .s{font-size:11px;color:var(--muted)}
  .ic{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .ic .ti{font-size:18px}
  .ic-sick{background:#FCEBEB;color:var(--sick)} .ic-personal{background:#FDF0E2;color:var(--personal)}
  .ic-holiday{background:#F3E8FA;color:var(--holiday)} .ic-vacation{background:#E1F5EE;color:var(--vacation)}
  .ic-swap{background:#E6F1FB;color:var(--swap)} .ic-other{background:#EEF0F2;color:var(--other)}

  .calwrap{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
  .mnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .mnav h3{flex:1;text-align:center;margin:0;font-size:17px;color:var(--brand)}
  .mnav .btn{width:38px;height:38px;padding:0;border-radius:12px}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .wd{text-align:center;font-size:12px;color:var(--brand-3);padding:4px 0;font-weight:600}
  .day{background:#FAFCF8;border:1px solid #EDF3E6;border-radius:10px;min-height:76px;padding:4px;cursor:pointer;position:relative;user-select:none;transition:background .12s}
  .day:hover{background:var(--soft)}
  .day.blank{background:transparent;border:0;cursor:default}
  .day.today{border-color:var(--brand-3);box-shadow:inset 0 0 0 1px var(--brand-3)}
  .day.today .dn span:first-child{background:var(--brand-2);color:#fff;border-radius:6px;padding:0 5px}
  .day.myoff{background:#EEF3E8;border-style:dashed}
  .day.myoff .dn{color:#9DB38A}
  .day.sel{background:var(--brand-2);border-color:var(--brand-2)}
  .day.sel .dn{color:#fff}
  .day.warn{border-color:#F09595;background:#FFF7F6}
  .dn{font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:flex-start;gap:2px}
  .dn .w{color:var(--bad);font-size:13px;margin-left:2px}
  .dn .offl{color:#D32F2F;font-size:10px;font-weight:700;line-height:12px;text-align:right;word-break:break-word;min-width:0}
  .day.sel .dn .offl{color:#FFD6D6}
  .chip.blk{color:#FFD60A!important}
  .chip .late{font-style:normal;font-size:8px;margin-right:1px;vertical-align:1px}
  .stt td,.stt th{text-align:center} .stt td:first-child,.stt th:first-child{text-align:left}
  .stt tr.sum td{font-weight:700;border-top:2px solid var(--line)}
  .ptc{cursor:pointer} .ptc .sumr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
  .seg button{border:0;background:#fff;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--brand-2);color:#fff}
  .wkl{display:flex;flex-direction:column;gap:4px}
  .wkr{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
  .wkr.bad{border-color:#F3C2C2;background:#FFF8F7}
  .wk1{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .wk1 b{min-width:42px}
  .wkh{min-width:58px;text-align:right;font-weight:600} .wkot{color:var(--brand-2);font-weight:700}
  .wk2{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .wkf{font-size:12px;color:var(--muted)} .wkf.bad{color:var(--bad);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
  .chip{font-size:11px;line-height:16px;padding:0 4px;border-radius:5px;font-weight:700;color:#fff;background:var(--other)}
  .chip.off{background:transparent;color:#A7BC94;font-weight:600;padding:0 2px}
  .day.sel .chip.off{color:#C0DD97}
  .chip.mine{outline:2px solid var(--ink);outline-offset:-1px}
  .chip.off.mine{outline:0;color:var(--ink)}
  .chip.pend{background:#fff!important;border:1.5px dashed currentColor;line-height:13px}
  .t-sick{background:var(--sick);color:var(--sick)} .t-personal{background:var(--personal);color:var(--personal)}
  .t-holiday{background:var(--holiday);color:var(--holiday)} .t-vacation{background:var(--vacation);color:var(--vacation)}
  .t-swap{background:var(--swap);color:var(--swap)} .t-other{background:var(--other);color:var(--other)}
  .chip.lv:not(.pend){color:#fff}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:10px 2px}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .legend i.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
  .selbar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 10px);background:var(--brand);color:#fff;border-radius:16px;padding:10px 12px 10px 16px;display:flex;gap:8px;align-items:center;z-index:9;box-shadow:0 10px 30px rgba(23,52,4,.3);max-width:640px;margin:0 auto}
  .selbar .muted{color:#C0DD97}
  .selbar .btn-ghost{color:#C0DD97}
  .selbar .btn-p{background:var(--brand-4);color:var(--brand)}
  @media(min-width:900px){.selbar{bottom:20px}}

  .st{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .st-รออนุมัติ{background:#FAEEDA;color:#854F0B} .st-อนุมัติ{background:var(--soft);color:var(--brand-2)}
  .st-ไม่อนุมัติ{background:#FCEBEB;color:var(--bad)} .st-ยกเลิก{background:#EEF0F2;color:#888}
  .st-ขอยกเลิก{background:#F3E8FA;color:#D4537E}
  .tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--brand-2);font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .flag{font-size:13px;color:var(--bad);background:#FFF3F1;border:1px solid #F7C1C1;border-radius:10px;padding:8px 10px;margin-top:8px}
  .flag .ti{margin-right:3px}
  .tchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px 3px 4px;border-radius:99px}
  .tchip .ti{font-size:15px;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff}
  .tc-sick{background:#FCEBEB;color:var(--sick)} .tc-personal{background:#FDF0E2;color:#B85C0A}
  .tc-holiday{background:#F3E8FA;color:var(--holiday)} .tc-vacation{background:#E1F5EE;color:#0F6E56}
  .tc-swap{background:#E6F1FB;color:#185FA5} .tc-other{background:#EEF0F2;color:var(--other)}
  table.tb{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
  .tb th{background:var(--brand);color:#fff;font-weight:600;padding:10px 8px;font-size:13px}
  .tb td{border-top:1px solid var(--line);padding:9px 8px;text-align:center}
  .tb td:first-child,.tb th:first-child{text-align:left}
  .tb tr.click{cursor:pointer} .tb tr.click:hover td{background:#F6FAF2}
  .scroll{overflow-x:auto;border-radius:var(--r)}
  .ok-ic{color:var(--brand-2);font-size:18px} .wait-ic{color:var(--warn);font-size:18px}

  .mbg{position:fixed;inset:0;background:rgba(15,30,5,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  @media(min-width:700px){.mbg{align-items:center}}
  .modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 22px}
  .modal::before{content:'';display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 12px}
  @media(min-width:700px){.modal{border-radius:22px}.modal::before{display:none}}
  .modal h3{margin:0 0 8px;font-size:18px;color:var(--brand);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  @media(min-width:520px){.opts.types{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .opts.inline{display:flex;flex-wrap:wrap}
  .opt{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:600;background:#fff;display:flex;align-items:center;gap:10px;transition:border .12s,background .12s}
  .opt.on{border-color:var(--brand-2);background:#F3F8EC}
  .opt.dis{opacity:.4;pointer-events:none}
  .opt small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
  .datelist{display:flex;flex-wrap:wrap;gap:5px}
  .toast{position:fixed;bottom:calc(var(--nav-h) + 80px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:40;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .loading{text-align:center;color:var(--muted);padding:40px 0}
  .loading::before{content:'';display:block;width:28px;height:28px;margin:0 auto 10px;border:3px solid var(--soft);border-top-color:var(--brand-3);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .icon-btn.spin .ti{animation:spin .8s linear infinite}
  .ecard{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .ecard .card{margin:0;cursor:pointer;transition:box-shadow .15s}
  .ecard .card:hover{box-shadow:0 6px 18px rgba(23,52,4,.08)}
  .abbr{display:inline-block;font-size:12px;font-weight:700;background:var(--brand-2);color:#fff;border-radius:7px;padding:0 7px;line-height:20px}
  .ava{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--brand-2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  .days7{display:flex;gap:5px;flex-wrap:wrap}
  .days7 label{border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;display:flex;align-items:center}
  .days7 input{width:auto;margin:0 5px 0 0;accent-color:var(--brand-2)}
  .chk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
  .chk input{width:auto;accent-color:var(--brand-2)}
  .sec{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--brand);margin:18px 0 8px}
  @media(max-width:600px){.hide-sm{display:none}}
  .br{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;line-height:18px;color:#fff}
  .br-YA{background:#3B6D11;color:#fff} .br-HE{background:#6B3FA0;color:#fff}
  .chip.br-YA{background:#3B6D11} .chip.br-HE{background:#6B3FA0}
  .chip.adj{font-style:italic;text-decoration:underline}
  .chip.slot{background:#fff!important;border:1.5px dashed currentColor;line-height:13px}
  .chip.slot.br-YA{color:#3B6D11} .chip.slot.br-HE{color:#6B3FA0}
  .chip.avail{background:#fff;color:var(--brand-2);border:1.5px solid var(--brand-4)}
  .chip .swp{font-style:normal;font-size:9px;margin-right:1px}
  .sws{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#EEF0F2;color:#666}
  .sws.wait{background:#FAEEDA;color:#854F0B} .sws.ok{background:var(--soft);color:var(--brand-2)} .sws.no{background:#FCEBEB;color:var(--bad)} .sws.cx{background:#F3E8FA;color:#D4537E}
  .swcard.act{border-color:var(--warn,#E0A100);box-shadow:0 0 0 2px #FAEEDA}
  .bkrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .bkrow select{width:auto;padding:5px 6px;font-size:13px}
  .shift{display:block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 4px;color:#fff;text-align:center;line-height:1.25;margin-top:2px}
  .shift.br-YA{background:#3B6D11} .shift.br-HE{background:#6B3FA0}
  .filt{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
  .fchk{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
  .fchk input{width:auto;margin:0;accent-color:var(--brand-2)}
  .brbox{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:#fff}
  .brh{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .srow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px dashed #EDF3E6}
  .srow:first-of-type{border-top:0}
  .srow .tm{font-variant-numeric:tabular-nums;font-weight:700;width:44px;color:var(--muted);font-size:13px}
  .ab-YA{background:#3B6D11} .ab-HE{background:#6B3FA0}
  .day.past{opacity:.45}
  .special{display:inline-flex;align-items:center;gap:4px;background:#FFF1C2;color:#7A5300;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
  .dlgmsg{white-space:pre-line}
  .msel{width:auto;padding:5px 6px;font-size:13px;border-radius:8px}
  nav{overflow-x:auto} nav button{min-width:58px}
  .stat-ok{border-color:#C0DD97;background:#F6FAF1} .stat-wait{border-color:#FAC775;background:#FFFBF2}
  .perf{position:fixed;left:8px;bottom:calc(var(--nav-h) + 8px);background:rgba(23,52,4,.88);color:#fff;font-size:11px;padding:4px 9px;border-radius:8px;z-index:7;max-width:calc(100% - 16px);pointer-events:none}
  @media(min-width:900px){.perf{bottom:8px}}
  .login input.em{font-size:16px;letter-spacing:0}
</style>
</head>
<body>

<div class="login" id="loginView">
  <form class="box" id="lgForm" onsubmit="event.preventDefault();lgSubmit()" novalidate>
    <div class="logo" id="logo"><i class="ti ti-key"></i></div>
    <h1>ระบบพนักงาน</h1>

const parts = s => s.split('-').map(Number);

const addDays = (s,n) => { const p=parts(s); return new Date(Date.UTC(p[0],p[1]-1,p[2]+n)).toISOString().slice(0,10); };

function datesRange(list){
  if(!list.length) return '';
  if(list.length===1) return th(list[0]);
  let consecutive = list.every((d,i)=> i===0 || addDays(list[i-1],1)===d);

async function call(fn, _token, ...args){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ doLogout(true); throw new Error('กรุณาเข้าสู่ระบบใหม่'); }
  const t0 = performance.now();
  let r;
  try{
    const res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token, 'apikey':SUPABASE_KEY }, body: JSON.stringify({ fn, args }) });
    r = await res.json();
  }catch(e){ throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง'); }
  showPerf(fn, performance.now()-t0, r && r.ms);
  if(!r || r.error){
    const m = String((r && (r.error || r.message || r.msg)) || 'เกิดข้อผิดพลาด');
    if(m.includes('SESSION_EXPIRED')){ doLogout(true); throw new Error('กรุณาเข้าสู่ระบบใหม่'); }
    throw new Error(m);
  }
  return r.data;
}
let LAST_BTN=null, LAST_BTN_AT=0;
document.addEventListener('click', e => { const b=e.target.closest && e.target.closest('button'); if(b){ LAST_BTN=b; LAST_BTN_AT=Date.now(); } }, true);
const INFLIGHT = new Set();
function api(fn, ...a){
  if(/^get/.test(fn)) return call(fn, TOKEN, ...a);
  const key = fn+'|'+JSON.stringify(a);
  if(INFLIGHT.has(key)) return Promise.reject(new Error('กำลังดำเนินการ กรุณารอสักครู่'));
  INFLIGHT.add(key);
  const b = (LAST_BTN && Date.now()-LAST_BTN_AT<1500 && document.contains(LAST_BTN)) ? LAST_BTN : null;
  if(b) b.disabled=true; document.body.classList.add('busy');
  const done = () => { INFLIGHT.delete(key); if(b) b.disabled=false; if(!INFLIGHT.size) document.body.classList.remove('busy'); };
  return call(fn, TOKEN, ...a).then(r => (done(), r), e => { done(); throw e; });
}

      <div class="q"><div class="k">${icBox('ลากิจ')}ลากิจ ใช้ไป</div><div class="v">${fd(q.personal.used)} <small>วัน</small></div></div>

    <span><i class="sw" style="border:1.5px dashed #888;background:#fff"></i>รออนุมัติ / ยังไม่จัด PT</span>

    ${mgr?`<span><u><i>ตัวเอียง</i></u> = HR ปรับ</span><span style="color:var(--bad)">${ico('alert-triangle')} ไม่ครบ</span>`:''}
  </div></div>`;

  if(!mgr && DETAIL && DETAIL.slice(0,7)===D.ym) h+=`<div class="card"><h3 style="margin:0 0 8px;font-size:16px;color:var(--brand)">${ico('calendar-event')} ${DAY_TH[dow(DETAIL)]} ${th(DETAIL)}</h3>${dayDetailHtml(DETAIL,false)}</div>`;
  $('main').innerHTML=h;
  $('main').querySelectorAll('.day[data-d]').forEach(el=>el.onclick=()=>onDay(el.dataset.d));
  updateSelBar();
}
function moveMonth(n){ YM=addMonth(D.ym,n); SEL.clear(); $('main').innerHTML='<div class="loading">กำลังโหลด...</div>'; reload(); }
function onDay(d){
  if(isMgr()) return openDay(d);

  if(!isPC() && isMyOff(d)){ toast('วันนี้เป็นวันหยุดประจำของคุณ'); return viewCal(); }
  SEL.has(d) ? SEL.delete(d) : SEL.add(d);
  viewCal();
}

  if(mgr) lfRange(); else lfRenderDates();

}
function lfEmp(){ return isMgr() ? D.emps.find(e=>e.id===$('lfEmp').value) : me(); }
function lfRange(){
  const e=lfEmp(); let a=$('lfFrom').value, b=$('lfTo').value;
  if(!a){ LF.dates=[]; return lfRenderDates(); }
  if(!b||b<a){ b=a; $('lfTo').value=a; }
  const out=[]; let d=a, n=0;
  while(d<=b && n<62){ if(LF.type==='สลับวันหยุด' || !(e.offDays||[]).includes(dow(d))) out.push(d); d=addDays(d,1); n++; }
  LF.dates = LF.type==='สลับวันหยุด' ? out.slice(0,1) : out;
  lfRenderDates();
}
function lfRenderDates(){
  $('lfDates').innerHTML = LF.dates.length ? LF.dates.map(d=>`<span class="tag">${ico('calendar')} ${DAY_TH[dow(d)].slice(0,2)} ${th(d)}</span>`).join('') : '<span class="muted">ไม่มีวันที่ (อาจตรงวันหยุดประจำทั้งหมด)</span>';
  $('lfN').textContent = LF.dates.length+' วัน';
  lfUpdate();
}
function pickType(t){
  LF.type=t;
  document.querySelectorAll('#lfTypes .opt').forEach(o=>o.classList.toggle('on', o.dataset.t===t));
  if(isMgr()) lfRange(); else lfUpdate();
}
function pickPeriod(p){
  LF.period=p;
  document.querySelectorAll('#lfHalf .opt').forEach(o=>o.classList.toggle('on', o.dataset.p===p));
}
function lfUpdate(){
  const t=D.types.find(x=>x.label===LF.type);
  const half = t && t.half && LF.dates.length===1;
  $('lfHalf').hidden=!half; if(!half) pickPeriod('เต็มวัน');
  const swap = LF.type==='สลับวันหยุด';
  $('lfSwap').hidden=!swap;
  if(swap){ const e=lfEmp(); $('lfSwapHint').textContent='วันหยุดประจำ: '+((e.offDays||[]).map(x=>DAY_TH[x]).join(', ')||'-')+' · เลือกได้ 1 วันต่อคำขอ'; }
  const sick = LF.type==='ลาป่วย';
  $('lfFileBox').hidden=!sick;
  $('lfFileReq').textContent = LF.dates.length>=3 ? '(บังคับ: ลา 3 วันขึ้นไป)' : '(ไม่บังคับ)';
}
function readFile(f){
  return new Promise((res,rej)=>{
    if(f.size>5*1024*1024) return rej(new Error('ไฟล์ใหญ่เกิน 5MB'));
    const r=new FileReader(); r.onload=()=>res({name:f.name, mime:f.type||(/\.pdf$/i.test(f.name)?'application/pdf':/\.(heic|heif)$/i.test(f.name)?'image/heic':/\.png$/i.test(f.name)?'image/png':'image/jpeg'), data:String(r.result).split(',')[1]}); r.onerror=()=>rej(new Error('อ่านไฟล์ไม่ได้')); r.readAsDataURL(f);
  });
}
async function submitLeaveForm(confirmOver){
  if(!LF.type) return toast('เลือกประเภทวันลา');
  if(!LF.dates.length) return toast('ไม่มีวันที่');
  const btn=$('lfBtn'); btn.disabled=true; btn.textContent='กำลังส่ง...';
  try{
    if(!confirmOver){
      const f=$('lfFile') && $('lfFile').files[0];
      LF.file = (LF.type==='ลาป่วย' && f) ? await readFile(f) : null;
    }
    const req={ dates:LF.dates, type:LF.type, period:LF.period, reason:$('lfReason').value.trim(),
      swapDate: $('lfSwapDate') ? $('lfSwapDate').value : '', file:LF.file, confirmed:!!confirmOver };
    if(isMgr()){ req.empId=$('lfEmp').value; req.note=$('lfNote').value.trim(); }
    const r=await api('submitLeave', req);
    if(r.needConfirm){
      btn.disabled=false; btn.textContent='ส่งคำขอ';
      if(await confirmDlg(r.message, 'ยืนยันส่งคำขอ')) return submitLeaveForm(true);
      return;
    }
    closeModal(); SEL.clear();
    toast(r.status==='อนุมัติ' ? 'บันทึกแล้ว' : 'ส่งคำขอแล้ว รอ HR อนุมัติ');
    if(isMgr() && r.warns && r.warns.length) setTimeout(()=>alertDlg('ข้อควรระวัง', r.warns.join('<br>')), 300);
    reload();
  }catch(e){ toast(e.message); btn.disabled=false; btn.textContent=isMgr()?'บันทึก (อนุมัติทันที)':'ส่งคำขอ'; }
}

const SWK = {same:'แลกเวรวันเดียวกัน', days:'แลกวันทำงาน–วันหยุด'};
function swCls(st){ return /^ขอยกเลิก/.test(st)?'cx':st==='อนุมัติ'?'ok':['รอคู่ยอมรับ','รออนุมัติ'].includes(st)?'wait':['ไม่อนุมัติ','คู่ปฏิเสธ'].includes(st)?'no':''; }
function swDesc(w){
  return w.kind==='same' ? `${DAY_TH[dow(w.dateX)].slice(0,2)} ${th(w.dateX)} · ${esc(w.aName)} ⇄ ${esc(w.bName)}`
    : `${esc(w.aName)} ทำแทน ${esc(w.bName)} ${th(w.dateX)} · ${esc(w.bName)} ทำแทน ${esc(w.aName)} ${th(w.dateY)}`;
}
function swapSection(){
  if(!D.swapPartners) return '';
  const me=String(D.me.login).toUpperCase(), list=D.swaps||[];
  let h=`<div class="row" style="margin:6px 0 8px"><div class="sec sp" style="margin:0">${ico('arrows-exchange')} แลกเวร</div>
    ${D.swapPartners.length?`<button class="btn btn-sm btn-p" onclick="openSwapForm()">${ico('plus')} ขอแลกเวร</button>`:''}</div>`;
  if(!D.swapPartners.length && !list.length) return h+`<div class="muted" style="font-size:13px;margin-bottom:10px">ไม่มีคนในกลุ่มเวรเดียวกันที่แลกด้วยได้</div>`;
  h+= list.length ? list.map(w=>{
    const iA=w.a===me, iB=w.b===me, other=iA?w.bName:w.aName;
    let act='', need=false;
    if(w.status==='รอคู่ยอมรับ' && iB){ need=true; act=`<button class="btn btn-sm btn-bad" onclick="swResp('${w.id}',false)">${ico('x')} ปฏิเสธ</button><button class="btn btn-sm btn-ok" onclick="swResp('${w.id}',true)">${ico('check')} ยอมรับ</button>`; }
    else if((w.status==='รอคู่ยอมรับ'||w.status==='รออนุมัติ') && iA) act=`<button class="btn btn-sm btn-ghost" onclick="swWithdraw('${w.id}')">${ico('x')} ถอนคำขอ</button>`;
    else if(w.status==='อนุมัติ' && (w.kind==='same'?w.dateX:(w.dateX>w.dateY?w.dateX:w.dateY))>=D.today) act=`<button class="btn btn-sm btn-ghost" onclick="swCancelReq('${w.id}')">${ico('arrow-back-up')} ขอยกเลิก</button>`;
    else if(w.status==='ขอยกเลิก (รอคู่)' && w.cancelBy!==me){ need=true; act=`<button class="btn btn-sm" onclick="swCancelResp('${w.id}',false)">ไม่ตกลง</button><button class="btn btn-sm btn-bad" onclick="swCancelResp('${w.id}',true)">${ico('check')} ตกลงยกเลิก</button>`; }
    return `<div class="card swcard ${need?'act':''}" style="padding:10px 12px"><div class="row"><b class="sp">${swDesc(w)}</b><span class="sws ${swCls(w.status)}">${esc(w.status)}</span></div>
      <div class="muted" style="font-size:12px;margin-top:4px">${SWK[w.kind]} · ${iA?'คุณขอแลกกับ '+esc(other):esc(other)+' ขอแลกกับคุณ'}${w.reason?' · '+esc(w.reason):''}${w.hrNote?' · HR: '+esc(w.hrNote):''}</div>
      ${w.summary?`<div style="font-size:12px;margin-top:4px">${esc(w.summary).split(' | ').join('<br>')}</div>`:''}
      ${act?`<div class="row" style="margin-top:8px;gap:6px"><span class="sp"></span>${act}</div>`:''}</div>`;
  }).join('') : `<div class="muted" style="font-size:13px;margin-bottom:10px">ยังไม่มีรายการแลกเวร</div>`;
  return h;
}

    startDate:$('emStart').value, status:$('emStatus').value, note:$('emNote').value.trim(), kind:$('emKind').value, pcMode:$('emPcMode').value };
  if(!emp.nickname) return toast('กรอกชื่อเล่น');
  $('emBtn').disabled=true;
  try{ const nid=await api('saveEmployee', emp); closeModal(); toast('บันทึกแล้ว ('+nid+')'+(id?'':' อย่าลืมสร้างบัญชีให้คนใหม่ในหน้าตั้งค่า')); viewEmps(); reload(); }
  catch(e){ toast(e.message); $('emBtn').disabled=false; }
}

  'ยกเลิกทั้งคำขอ':['trash','tc-sick'],'ยกเลิกคำขอ (รออนุมัติ)':['x','tc-other'],'ขอยกเลิกวันลา':['arrow-back-up','tc-holiday'],'อนุมัติการยกเลิก':['check','tc-holiday'],
  'ไม่ให้ยกเลิก':['x','tc-holiday'],'ยืนยันวันลาประจำเดือน':['checks','tc-vacation'],'เปลี่ยน PIN':['key','tc-other'],'สุ่ม PIN ใหม่':['key','tc-swap'],
  'ปลดล็อก':['lock-open','tc-swap'],'ออกจากระบบทุกเครื่อง':['device-mobile-off','tc-sick'],'แก้ข้อมูลพนักงาน':['user-edit','tc-personal'],'เพิ่มพนักงาน':['user-plus','tc-vacation'],'ปรับตาราง':['calendar-cog','tc-swap'],'เปลี่ยนกลุ่ม/สถานะ':['users-group','tc-personal'],'ทวนวันหยุดเดือนหน้า':['calendar-search','tc-holiday'],'เข้าระบบจากอุปกรณ์ใหม่':['device-mobile','tc-other']};
async function viewAudit(){
  $('main').innerHTML='<div class="loading">กำลังโหลด...</div>';
  try{ AUDIT=await api('getAudit', 500); }catch(e){ return toast(e.message); }
  const acts=[...new Set(AUDIT.map(a=>a.action))].sort();
  $('main').innerHTML=`<h2 class="t">${ico('history')} ประวัติการแก้ไข</h2>
    <p class="muted" style="font-size:13px">${ico('lock')} บันทึกอัตโนมัติ ลบหรือแก้ไขไม่ได้จากระบบ · แสดงล่าสุด ${AUDIT.length} รายการ</p>
    <div class="row" style="margin-bottom:10px"><input id="auQ" class="sp" style="min-width:180px" placeholder="ค้นหาชื่อ / ตัวย่อ / รายละเอียด" oninput="renderAudit()">
      <select id="auA" style="width:auto;min-width:160px" onchange="renderAudit()"><option value="">ทุกการกระทำ</option>${acts.map(a=>`<option>${esc(a)}</option>`).join('')}</select></div>
    <div id="auList"></div>`;
  renderAudit();
}
function renderAudit(){
  const q=$('auQ').value.trim().toLowerCase(), a=$('auA').value;
  const list=AUDIT.filter(x=>(!a||x.action===a)&&(!q||[x.by,x.target,x.detail,x.action].join(' ').toLowerCase().includes(q)));
  $('auList').innerHTML=list.length?list.map(x=>{ const [i,c]=AUD_IC[x.action]||['point','tc-other'];
    return `<div class="card" style="padding:10px 14px"><div class="row"><span class="tchip ${c}">${ico(i)}${esc(x.action)}</span><b>${esc(x.target)}</b>
      <span class="sp"></span><span class="muted" style="font-size:12px">${ico('clock')} ${esc(x.at)}</span></div>
      <div style="margin-top:6px;font-size:14px">${esc(x.detail)}</div>
      <div class="muted" style="font-size:12px;margin-top:4px">${ico('user')} โดย ${esc(x.by)}</div></div>`;}).join(''):empty('history-off','ไม่พบรายการ');
}

/* ---------------- settings (admin) ---------------- */
async function viewSettings(){
  $('main').innerHTML='<div class="loading">กำลังโหลด...</div>';
  let users; try{ users=await api('getUsers'); }catch(e){ return toast(e.message); }
  USERS=users;
  const sel=(id,opts,v)=>`<select id="${id}" class="msel">${opts.map(k=>`<option ${k===v?'selected':''}>${k}</option>`).join('')}</select>`;
  $('main').innerHTML=`<h2 class="t">${ico('users-group')} ผู้ใช้และบัญชีเข้าระบบ</h2>
    <p class="muted" style="font-size:13px">"สร้างบัญชี" ใช้อีเมลในทะเบียนพนักงาน ระบบสุ่มรหัสชั่วคราวและส่งอีเมลให้ (โหมดทดสอบ: ส่งเข้าอีเมล Admin) · พนักงานต้องตั้งรหัสใหม่ตอน login ครั้งแรก · สถานะลาออก/ปิดใช้งาน = เข้าระบบไม่ได้ทันที</p>
    <div class="scroll"><table class="tb"><tr><th>ผู้ใช้</th><th>กลุ่ม</th><th>สถานะ</th><th>PC นับ</th><th></th><th>บัญชี</th></tr>
    ${users.map(u=>`<tr style="${u.status==='ทำงานอยู่'?'':'opacity:.6'}"><td><b>${esc(u.login)}</b> ${esc(u.name)}
        <div class="muted" style="font-size:11px">${u.email?esc(u.email):'<span style="color:var(--bad)">ไม่มีอีเมล</span>'}${u.role!=='staff'?' · '+esc(u.role):''}</div></td>
      ${u.admin?`<td colspan="4" class="muted">ผู้ดูแลระบบ</td>`:`<td>${sel('mk_'+u.empId,['Staff','PC','PT','pPT','Test'],u.kind)}</td>
        <td>${sel('ms_'+u.empId,['ทำงานอยู่','ลาออก','ปิดใช้งาน'],u.status)}</td>
        <td>${u.kind==='PC'?sel('mp_'+u.empId,['วันหยุด','วันทำงาน'],u.pcMode):`<input type="hidden" id="mp_${u.empId}" value="${esc(u.pcMode)}"><span class="muted">-</span>`}</td>
        <td><button class="btn btn-sm btn-p" onclick="saveMember('${u.empId}')" aria-label="บันทึก">${ico('device-floppy')}</button></td>`}
      <td>${u.linked?`<span class="st st-อนุมัติ">มีบัญชี</span><div style="margin-top:4px"><button class="btn btn-sm" onclick="doAccount('${u.empId}',false)">${ico('key')} รีเซ็ตรหัส</button></div>`
        :`<button class="btn btn-sm btn-p" ${u.email?'':'disabled'} onclick="doAccount('${u.empId}',true)">${ico('user-plus')} สร้างบัญชี</button>`}</td></tr>`).join('')}
    </table></div>
    <h2 class="t" style="margin-top:26px">${ico('flask')} สถานะระบบใหม่ (เฟส 1)</h2>
    <div class="card">ใช้งานได้: ปฏิทิน/ตารางเวร, ขอลา/อนุมัติ/ยกเลิก, ปรับเวร, ปิดเดือน, ทวนวันหยุด, สถิติลา, พนักงาน, ประวัติ, แจ้งเตือน, อีเมล (โหมดทดสอบ)
      <div class="muted" style="font-size:13px;margin-top:6px">เฟส 2: PT ลงวันว่าง, จัด PT, pPT จองเวร, แลกเวร · เฟส 3: เวลางาน/สแกนนิ้ว, เงินเดือน, สลิป, ใบลา PDF, แจ้งเตือนอัตโนมัติ, backup</div>
      <div class="flag" style="margin-top:8px">${ico('alert-triangle')} ช่วงทดสอบ: ข้อมูลที่กดในระบบนี้จะไม่ย้อนไปที่ Google Sheet และจะถูกล้างเมื่อรันย้ายข้อมูลรอบใหม่</div></div>`;
}
async function doAccount(id, isNew){
  const u=USERS.find(x=>x.empId===id); if(!u) return;
  if(!await confirmDlg((isNew?'สร้างบัญชีให้ ':'รีเซ็ตรหัสผ่านของ ')+u.name+' ('+u.email+')? ระบบจะสุ่มรหัสชั่วคราวและส่งอีเมลให้', isNew?'สร้างบัญชี':'รีเซ็ตรหัส')) return;
  try{ const r=await api(isNew?'createAccount':'resetPassword', id, '');
    alertDlg(isNew?'สร้างบัญชีแล้ว':'รีเซ็ตรหัสแล้ว', `อีเมล: <b>${esc(r.email)}</b><br>รหัสชั่วคราว: <b style="font-size:18px;letter-spacing:1px">${esc(r.password)}</b><div class="muted" style="font-size:12px;margin-top:8px">ส่งทางอีเมลแล้ว · พนักงานต้องตั้งรหัสใหม่ตอน login ครั้งแรก</div>`);
    viewSettings(); }
  catch(e){ toast(e.message); }
}
let USERS=[];
async function saveMember(id){
  const u=USERS.find(x=>x.empId===id), ch={kind:$('mk_'+id).value, status:$('ms_'+id).value, pcMode:$('mp_'+id).value};
  if(ch.kind==='Staff' && u.kind!=='Staff' && u.kind!=='Test'){
    const d=await promptDlg('เปลี่ยน '+u.name+' เป็นพนักงาน','วันเริ่มงานใหม่ (ปปปป-ดด-วว) เช่น '+D.today,'บันทึก');
    if(d===null) return; ch.startDate=d.trim();
  }
  try{ await api('setMember', id, ch); toast('บันทึกแล้ว'); viewSettings(); }catch(e){ toast(e.message); }
}
async function doLogoutAll(login, n){
  if(!await confirmDlg('ออกจากระบบทุกเครื่องของ '+login+' ('+n+' เครื่อง)? เจ้าของต้อง login ใหม่ด้วย PIN เดิม','ออกทุกเครื่อง')) return;
  try{ const k=await api('logoutAll', login); toast('ปิดแล้ว '+k+' เครื่อง'); viewSettings(); }catch(e){ toast(e.message); }
}
async function doUnlock(login){
  try{ await api('unlockUser', login); toast('ปลดล็อก '+login+' แล้ว'); viewSettings(); }catch(e){ toast(e.message); }
}
async function doResetPins(){
  const logins=Array.from(document.querySelectorAll('.uchk:checked')).map(c=>c.value);
  if(!logins.length) return toast('เลือกผู้ใช้ก่อน');
  if(!await confirmDlg('สุ่ม PIN ใหม่ให้ '+logins.length+' คน? PIN เดิมจะใช้ไม่ได้','สุ่ม PIN')) return;
  $('pinBtn').disabled=true;
  try{ const r=await api('resetPins', logins); const fail=r.filter(x=>!x.sent);
    alertDlg('สุ่ม PIN แล้ว', 'ส่งอีเมลสำเร็จ '+(r.length-fail.length)+' คน'+(fail.length?'<br>ส่งไม่ได้: '+fail.map(x=>esc(x.login)).join(', '):'')+'<br>สรุป PIN ทั้งหมดส่งเข้าอีเมล Admin แล้ว'); viewSettings(); }
  catch(e){ toast(e.message); $('pinBtn').disabled=false; }
}
async function doBackup(){ try{ const r=await api('backupNow'); toast('Backup แล้ว: '+r.name); }catch(e){ toast('Backup ไม่สำเร็จ: '+e.message); } }
async function doTriggers(){ try{ await api('installTriggers'); toast('ติดตั้งแจ้งเตือนรายวันแล้ว'); }catch(e){ toast(e.message); } }

/* ---------------- notifications ---------------- */
async function openNotis(){
  showModal('<div class="loading">กำลังโหลด...</div>');
  let list; try{ list=await api('getNotifications'); }catch(e){ closeModal(); return toast(e.message); }
  D.unread=0; updateBell();
  showModal(`<h3>${ico('bell')} แจ้งเตือน</h3>${list.length?list.map(n=>`<div class="card" style="padding:10px 12px;${n.read?'':'border-color:var(--brand-3);background:#F6FAF1'}">
    <div>${esc(n.msg)}</div><div class="muted" style="font-size:12px">${esc(n.at)}</div></div>`).join(''):empty('bell-off','ไม่มีแจ้งเตือน')}
    <div class="actions"><button class="btn" onclick="closeModal()">ปิด</button></div>`);
}

/* ---------------- modal / dialogs ---------------- */
function showModal(h){ $('modal').innerHTML=h; $('mbg').hidden=false; }
function closeModal(){ $('mbg').hidden=true; $('modal').innerHTML=''; }
function showDlg(h){ $('dlg').innerHTML=h; $('dbg').hidden=false; }
function closeDlg(){ $('dbg').hidden=true; $('dlg').innerHTML=''; }
function confirmDlg(msg, okText){
  return new Promise(res=>{
    showDlg(`<p class="dlgmsg" style="font-size:16px">${esc(msg)}</p><div class="actions"><button class="btn btn-ghost" id="dNo">ยกเลิก</button><button class="btn btn-p" id="dOk">${esc(okText||'ตกลง')}</button></div>`);
    $('dNo').onclick=()=>{closeDlg();res(false);}; $('dOk').onclick=()=>{closeDlg();res(true);};
  });
}
function promptDlg(title, ph, okText){
  return new Promise(res=>{
    showDlg(`<h3>${esc(title)}</h3><textarea id="dIn" placeholder="${esc(ph)}"></textarea><div class="actions"><button class="btn btn-ghost" id="dNo">ยกเลิก</button><button class="btn btn-p" id="dOk">${esc(okText)}</button></div>`);
    $('dNo').onclick=()=>{closeDlg();res(null);}; $('dOk').onclick=()=>{const v=$('dIn').value.trim();closeDlg();res(v);};
  });
}
function alertDlg(title, html){
  showDlg(`<h3>${esc(title)}</h3><div>${html}</div><div class="actions"><button class="btn btn-p" onclick="closeDlg()">ตกลง</button></div>`);
}

/* ---------------- boot ---------------- */
sb.auth.getSession().then(({ data:{ session } })=>{
  if(!session) return;
  TOKEN='sb';
  if(session.user && session.user.user_metadata && session.user.user_metadata.must_change) openChangePin(true); else start();
});
